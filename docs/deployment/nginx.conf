# DataMind AI — nginx reverse proxy config for Red Hat / RHEL
# Place at: /etc/nginx/conf.d/datamind.conf
#
# Prerequisites:
#   dnf install nginx certbot python3-certbot-nginx
#   certbot --nginx -d yourdomain.com
#   systemctl enable --now nginx

server {
    listen 80;
    server_name yourdomain.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # TLS — managed by certbot (auto-updated)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (also set by FastAPI middleware, belt-and-suspenders)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # Forward real client IP so rate limiters see the correct address
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;

    # Backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;   # allow up to 90s for LLM calls + margin
        proxy_send_timeout 30s;
        proxy_set_header   Connection "";
    }

    # Frontend (Vite build — static files)
    location / {
        root  /var/www/datamind/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache hashed assets forever, never cache index.html
        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-store";
        }
    }

    # Block direct access to .env and internal paths
    location ~ /\.(env|git|claude) {
        deny all;
        return 404;
    }
}
