name: Release

# Push a semver tag on main to cut a release:
#   git tag -a v3.1.0 -m "Release v3.1.0" && git push origin v3.1.0
# The workflow builds the frontend, packages the deploy patch and attaches the zip
# to a GitHub Release. No repo secrets needed - the frontend's .env.production is
# tracked and contains no secrets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: the patch notes diff against the previous tag

      - name: Verify tag is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Releases are cut from production only."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: datamind/frontend/package-lock.json

      - name: Build frontend
        working-directory: datamind/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build deploy patch
        run: python scripts/create_deploy_patch.py --version "${GITHUB_REF_NAME#v}" --no-build --no-tag

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: archives/PATCH_NOTES.txt
          files: archives/*.zip
