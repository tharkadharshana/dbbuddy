<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI logo">
  <defs>
    <linearGradient id="ai-lockup-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- 4-square badge -->
  <rect x="12" y="16" width="48" height="48" rx="13" fill="url(#ai-lockup-grad)"/>
  <g transform="translate(12,16) scale(3)">
    <rect x="2" y="2" width="5" height="5" rx="1" fill="rgba(255,255,255,0.95)"/>
    <rect x="9" y="2" width="5" height="5" rx="1" fill="rgba(255,255,255,0.5)"/>
    <rect x="2" y="9" width="5" height="5" rx="1" fill="rgba(255,255,255,0.5)"/>
    <rect x="9" y="9" width="5" height="5" rx="1" fill="rgba(255,255,255,0.95)"/>
  </g>
  <!-- AI wordmark -->
  <text x="78" y="42" dominant-baseline="central"
        font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="44"
        font-weight="800" fill="#4f8ef7" letter-spacing="-2">AI</text>
</svg>
